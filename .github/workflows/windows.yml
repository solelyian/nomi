name: Windows build

on:
  push:
    branches: [main, "devin/*-integrated-windows-ai"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained x64
        run: >
          dotnet publish Nomi.WinUI/Nomi.WinUI.csproj -c Release -r win-x64
          -p:Platform=x64 -p:PublishReadyToRun=true -o artifacts/Nomi-win-x64
      - name: Include app-local Visual C++ runtime
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+$' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64\Microsoft.VC*.CRT\*.dll"
          if (!$crt) { throw "Visual C++ redistributable DLLs not found" }
          $crt | Copy-Item -Destination artifacts/Nomi-win-x64
          foreach ($name in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (!(Test-Path "artifacts/Nomi-win-x64/$name")) { throw "Missing $name" }
          }
      - name: Sign application
        env:
          NOMI_SIGNING_PFX_BASE64: ${{ secrets.NOMI_SIGNING_PFX_BASE64 }}
          NOMI_SIGNING_PASSWORD: ${{ secrets.NOMI_SIGNING_PASSWORD }}
        run: |
          ./checks/windows-sign.ps1 -Files artifacts/Nomi-win-x64/Nomi.WinUI.exe
          if ($env:NOMI_SIGNING_PFX_BASE64 -and $env:NOMI_SIGNING_PASSWORD) {
            echo "NOMI_SIGN_INSTALLER=1" >> $env:GITHUB_ENV
          }
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "NOMI_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV";
          else echo "NOMI_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - name: Build installer
        env:
          NOMI_SIGNING_PFX_BASE64: ${{ secrets.NOMI_SIGNING_PFX_BASE64 }}
          NOMI_SIGNING_PASSWORD: ${{ secrets.NOMI_SIGNING_PASSWORD }}
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/Snomi=pwsh -NoProfile -File $PWD\checks\windows-sign.ps1 -Files `$p"
          installer\nomi.iss
      - name: Verify installer signature
        if: env.NOMI_SIGN_INSTALLER == '1'
        run: |
          $setup = Get-ChildItem artifacts/Nomi-Setup-*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature: $($signature.Status)" }
          $signature.SignerCertificate.Subject
      - name: Verify installed application starts
        run: ./checks/windows-startup.ps1
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: |
            artifacts/startup-*
            artifacts/startup.log
      - name: Verify embedded CPU engine without Ollama
        run: |
          if (!(Get-ChildItem artifacts/Nomi-win-x64 -Recurse -Filter llama.dll)) {
            throw "Embedded native llama library missing from publish output"
          }
          dotnet run --project checks/Nomi.Inference.Checks -c Release -- --embedded-live
      - name: Zip portable build
        run: Compress-Archive -Path artifacts/Nomi-win-x64/* -DestinationPath artifacts/Nomi-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nomi-windows
          path: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip
