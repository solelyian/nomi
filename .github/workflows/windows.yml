name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained x64
        run: >
          dotnet publish Nomi.WinUI/Nomi.WinUI.csproj -c Release -r win-x64
          -p:Platform=x64 -p:PublishReadyToRun=true -o artifacts/Nomi-win-x64
      - name: Include app-local Visual C++ runtime
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+$' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64\Microsoft.VC*.CRT\*.dll"
          if (!$crt) { throw "Visual C++ redistributable DLLs not found" }
          $crt | Copy-Item -Destination artifacts/Nomi-win-x64
          foreach ($name in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (!(Test-Path "artifacts/Nomi-win-x64/$name")) { throw "Missing $name" }
          }
      - name: Signing configuration
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = 'AZURE_TRUSTED_SIGNING_ENDPOINT', 'AZURE_TRUSTED_SIGNING_ACCOUNT', 'AZURE_TRUSTED_SIGNING_PROFILE',
            'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET' | Where-Object { !(Get-Item "env:$_").Value }
          if ($missing) {
            Write-Host "Signing skipped, secrets missing: $($missing -join ', ')"
            echo "NOMI_SIGN=0" >> $env:GITHUB_ENV
          } else { echo "NOMI_SIGN=1" >> $env:GITHUB_ENV }
      - name: Sign application (Azure Trusted Signing)
        if: env.NOMI_SIGN == '1'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\Nomi-win-x64\Nomi.WinUI.exe
          description: Nomi
          description-url: https://github.com/solelyian/nomi
      - name: Verify application signature
        if: env.NOMI_SIGN == '1'
        run: ./checks/windows-verify-signature.ps1 artifacts/Nomi-win-x64/Nomi.WinUI.exe
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "NOMI_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV";
          else echo "NOMI_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\nomi.iss'
      - name: Sign installer (Azure Trusted Signing)
        if: env.NOMI_SIGN == '1'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          description: Nomi
          description-url: https://github.com/solelyian/nomi
      - name: Verify installer signature
        if: env.NOMI_SIGN == '1'
        run: ./checks/windows-verify-signature.ps1 (Get-ChildItem artifacts/Nomi-Setup-*.exe).FullName
      - name: Use a 1920x1080 display for UI checks
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Format-Table Name, CurrentHorizontalResolution, CurrentVerticalResolution
      - name: Verify installed application starts
        run: ./checks/windows-startup.ps1
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-diagnostics
          path: |
            artifacts/startup-*
            artifacts/startup.log
            artifacts/ui-*.png
      - name: Verify Today, Board and Focus in the installed application
        run: ./checks/windows-v3.ps1
      - name: Verify the notification area and single instance
        run: ./checks/windows-presence.ps1
      - name: Verify embedded CPU engine without Ollama
        run: |
          if (!(Get-ChildItem artifacts/Nomi-win-x64 -Recurse -Filter llama.dll)) {
            throw "Embedded native llama library missing from publish output"
          }
          dotnet run --project checks/Nomi.Inference.Checks -c Release -- --embedded-live
      - name: Verify answer, copy and history in the installed application
        run: ./checks/windows-result.ps1
      - name: Verify local vision model on a captured spreadsheet
        run: dotnet run --project checks/Nomi.Inference.Checks -c Release -- --vision-live
      - name: Upload result screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: result-screens
          path: artifacts/ui-*.png
      - name: Zip portable build
        run: Compress-Archive -Path artifacts/Nomi-win-x64/* -DestinationPath artifacts/Nomi-win-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nomi-windows
          path: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Nomi-windows
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip
