name: Windows build

on:
  push:
    branches: [main, "devin/*-integrated-windows-ai"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained x64
        run: >
          dotnet publish Nomi.WinUI/Nomi.WinUI.csproj -c Release -r win-x64
          -p:Platform=x64 -p:PublishReadyToRun=true -o artifacts/Nomi-win-x64
      - name: Include app-local Visual C++ runtime
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+$' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64\Microsoft.VC*.CRT\*.dll"
          if (!$crt) { throw "Visual C++ redistributable DLLs not found" }
          $crt | Copy-Item -Destination artifacts/Nomi-win-x64
          foreach ($name in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (!(Test-Path "artifacts/Nomi-win-x64/$name")) { throw "Missing $name" }
          }
      - name: Signing configuration
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = 'AZURE_TRUSTED_SIGNING_ENDPOINT', 'AZURE_TRUSTED_SIGNING_ACCOUNT', 'AZURE_TRUSTED_SIGNING_PROFILE',
            'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET' | Where-Object { !(Get-Item "env:$_").Value }
          if ($missing) {
            Write-Host "Signing skipped, secrets missing: $($missing -join ', ')"
            echo "NOMI_SIGN=0" >> $env:GITHUB_ENV
          } else { echo "NOMI_SIGN=1" >> $env:GITHUB_ENV }
      - name: Sign application (Azure Trusted Signing)
        if: env.NOMI_SIGN == '1'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\Nomi-win-x64\Nomi.WinUI.exe
          description: Nomi
          description-url: https://github.com/solelyian/nomi
      - name: Verify application signature
        if: env.NOMI_SIGN == '1'
        run: ./checks/windows-verify-signature.ps1 artifacts/Nomi-win-x64/Nomi.WinUI.exe
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "NOMI_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV";
          else echo "NOMI_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\nomi.iss'
      - name: Sign installer (Azure Trusted Signing)
        if: env.NOMI_SIGN == '1'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          description: Nomi
          description-url: https://github.com/solelyian/nomi
      - name: Verify installer signature
        if: env.NOMI_SIGN == '1'
        run: ./checks/windows-verify-signature.ps1 (Get-ChildItem artifacts/Nomi-Setup-*.exe).FullName
      - name: Verify installed application starts
        run: ./checks/windows-startup.ps1
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: |
            artifacts/startup-*
            artifacts/startup.log
            artifacts/ui-*.png
      - name: Verify embedded CPU engine without Ollama
        run: |
          if (!(Get-ChildItem artifacts/Nomi-win-x64 -Recurse -Filter llama.dll)) {
            throw "Embedded native llama library missing from publish output"
          }
          dotnet run --project checks/Nomi.Inference.Checks -c Release -- --embedded-live
      - name: Zip portable build
        run: Compress-Archive -Path artifacts/Nomi-win-x64/* -DestinationPath artifacts/Nomi-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nomi-windows
          path: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip
