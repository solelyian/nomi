name: Windows build

on:
  push:
    branches: [main, "devin/*-integrated-windows-ai"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained x64
        run: >
          dotnet publish Nomi.WinUI/Nomi.WinUI.csproj -c Release -r win-x64
          -p:Platform=x64 -p:PublishReadyToRun=true -o artifacts/Nomi-win-x64
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "NOMI_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV";
          else echo "NOMI_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\nomi.iss'
      - name: Verify installed application starts
        run: ./checks/windows-startup.ps1
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: |
            artifacts/startup-*
            artifacts/startup.log
      - name: Verify embedded CPU engine without Ollama
        run: |
          if (!(Get-ChildItem artifacts/Nomi-win-x64 -Recurse -Filter llama.dll)) {
            throw "Embedded native llama library missing from publish output"
          }
          dotnet run --project checks/Nomi.Inference.Checks -c Release -- --embedded-live
      - name: Zip portable build
        run: Compress-Archive -Path artifacts/Nomi-win-x64/* -DestinationPath artifacts/Nomi-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nomi-windows
          path: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Nomi-Setup-*.exe
            artifacts/Nomi-win-x64.zip
