name: ios

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Create test simulator
        id: simulator
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios/ci-logs"
          exec > >(tee "$GITHUB_WORKSPACE/ios/ci-logs/simulator.log") 2>&1
          runtime_json="$(xcrun simctl list runtimes -j)"
          runtime="$(printf '%s' "$runtime_json" | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]; print(rs[-1]["identifier"])')"
          device_type="$(printf '%s' "$runtime_json" | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]; r=rs[-1]; print(next(d["identifier"] for d in r["supportedDeviceTypes"] if d.get("productFamily") == "iPhone"))')"
          udid="$(xcrun simctl create "Nomi CI iPhone" "$device_type" "$runtime")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Nomi.xcodeproj -scheme Nomi \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-logs/xcodebuild-build.log
      - name: Test NomiCore
        working-directory: ios/Packages/NomiCore
        run: |
          set -o pipefail
          xcodebuild test -scheme NomiCore \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$GITHUB_WORKSPACE/ios/ci-logs/xcodebuild-test.log"
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-diagnostics
          retention-days: 7
          path: ios/ci-logs/
      - name: Comment failure excerpt
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = [
              'ios/ci-logs/simulator.log',
              'ios/ci-logs/xcodebuild-build.log',
              'ios/ci-logs/xcodebuild-test.log'
            ];
            const sections = files.filter((file) => fs.existsSync(file)).map((file) => {
              const text = fs.readFileSync(file, 'utf8');
              const tail = text.length > 6000 ? text.slice(-6000) : text;
              return `\n\n<details><summary>${file}</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>`;
            }).join('');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `iOS CI failed. Relevant log tails:${sections || ' No diagnostic log was written.'}`
            });
