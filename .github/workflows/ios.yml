name: ios

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Create test simulator
        id: simulator
        run: |
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime_suffix="$(echo "$sdk_version" | tr '.' '-')"
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-$runtime_suffix"
          udid="$(xcrun simctl create "Nomi CI iPhone" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build app
        working-directory: ios
        run: >-
          xcodebuild -project Nomi.xcodeproj -scheme Nomi
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: Test NomiCore
        working-directory: ios/Packages/NomiCore
        run: >-
          xcodebuild test -scheme NomiCore
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO
