name: Nomi
options:
  bundleIdPrefix: com.nyne
  createIntermediateGroups: true
  # XcodeGen 2.48 writes objectVersion 77, which Xcode versions before 26 cannot read.
  # Keep the generated project openable by the Xcode versions used on GitHub-hosted runners.
  postGenCommand: sed -i '' 's/objectVersion = [0-9][0-9]*;/objectVersion = 60;/' Nomi.xcodeproj/project.pbxproj
packages:
  NomiCore:
    path: Packages/NomiCore
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.20.0
targets:
  Nomi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NomiIOS
        excludes:
          - "**/*.md"
    dependencies:
      - package: NomiCore
        product: NomiCore
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyne.Nomi
        PRODUCT_NAME: Nomi
        MARKETING_VERSION: 0.10.6
        CURRENT_PROJECT_VERSION: 106
        INFOPLIST_FILE: NomiIOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Nomi:
    build:
      targets:
        Nomi: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
